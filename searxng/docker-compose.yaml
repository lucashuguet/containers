services:
  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    pull_policy: always
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - shared_network
    volumes:
      - valkey-data2:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - shared_network
    ports:
      - 4000:8080
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:4000/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    dns:
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  shared_network:
    external: true

volumes:
  valkey-data2:
